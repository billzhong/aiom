name: Release

# Builds binaries and the web UI on every push to main; publishes them as a GitHub release
# for version tags.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  binaries:
    name: ${{ matrix.package }} ${{ matrix.target }}
    # The server is built with the dashboard of the web job.
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: aiom-server, target: x86_64-unknown-linux-musl, runner: ubuntu-latest }
          - { package: aiom-server, target: x86_64-unknown-linux-gnu, runner: ubuntu-latest }
          - { package: aiom-server, target: aarch64-unknown-linux-musl, runner: ubuntu-latest }
          - { package: aiom-client, target: x86_64-unknown-linux-musl, runner: ubuntu-latest }
          - { package: aiom-client, target: x86_64-unknown-linux-gnu, runner: ubuntu-latest }
          - { package: aiom-client, target: aarch64-unknown-linux-musl, runner: ubuntu-latest }
          - { package: aiom-client, target: x86_64-pc-windows-msvc, runner: windows-latest }
          - { package: aiom-client, target: aarch64-apple-darwin, runner: macos-latest }
    runs-on: ${{ matrix.runner }}
    env:
      # The client runs on every monitored host, so it is built for size.
      PROFILE: ${{ matrix.package == 'aiom-client' && 'release-small' || 'release' }}
      FEATURES: ${{ matrix.package == 'aiom-server' && '--features embed-web' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        if: matrix.package == 'aiom-server'
        with:
          name: web-dist
          path: web/dist
      - uses: houseabsolute/actions-rust-cross@v1
        with:
          target: ${{ matrix.target }}
          args: --locked --package ${{ matrix.package }} --profile ${{ env.PROFILE }} ${{ env.FEATURES }}
      - name: Package
        id: package
        shell: bash
        run: |
          name="${{ matrix.package }}-${{ matrix.target }}"
          ext=""
          [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/$PROFILE/${{ matrix.package }}$ext" LICENSE "dist/$name/"
          if [[ "${{ matrix.target }}" == *linux* ]]; then
            cp "deploy/${{ matrix.package }}.service" "dist/$name/"
          fi
          cd dist
          if [[ -n "$ext" ]]; then
            7z a "$name.zip" "$name" > /dev/null
            archive="$name.zip"
          else
            tar czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  web:
    name: aiom-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # Without VITE_WS_URL, the dashboard connects to the server serving it.
      - run: pnpm install --frozen-lockfile && pnpm run build
        working-directory: web
      # For the server to build in.
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1
      - name: Package
        run: |
          mkdir dist
          tar czf dist/aiom-web.tar.gz LICENSE -C web/dist .
          (cd dist && sha256sum aiom-web.tar.gz > aiom-web.tar.gz.sha256)
      - uses: actions/upload-artifact@v7
        with:
          name: aiom-web
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binaries, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches the crate version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [[ "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          path: dist
          # The archives, not the web-dist the server is built with.
          pattern: aiom-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
