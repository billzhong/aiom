[package]
name = "aiom-server"
description = "AIO Monitor server: collects client reports and serves them to the dashboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aiom-protocol.workspace = true
anyhow.workspace = true
axum = { workspace = true, features = ["http1", "tokio", "ws"] }
bytes.workspace = true
clap.workspace = true
dotenvy.workspace = true
natord.workspace = true
reqwest = { workspace = true, features = ["query"] }
rustls.workspace = true
subtle.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { workspace = true, features = ["compression-gzip", "fs", "trace"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
futures-util.workspace = true
axum = { workspace = true, features = ["query"] }
serde_json.workspace = true
tempfile.workspace = true
tokio-tungstenite.workspace = true

[lints]
workspace = true
