[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/client", "crates/protocol", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace.dependencies]
aiom-server = { path = "crates/server" }
aiom-client = { path = "crates/client" }
aiom-protocol = { path = "crates/protocol" }

anyhow = "1.0"
axum = { version = "0.8", default-features = false }
bytes = "1.10"
clap = { version = "4.6", features = ["derive", "env"] }
dotenvy = "0.15"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
flate2 = "1.1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
libc = "0.2"
log = "0.4"
natord = "1.0"
netstat2 = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rust-embed = { version = "8.13", features = ["mime-guess"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2.6"
sysinfo = { version = "0.39", default-features = false, features = ["disk", "network", "system"] }
tempfile = "3.20"
thiserror = "2.0"
tokio = "1.47"
tokio-tungstenite = "0.30"
tower = { version = "0.5", default-features = false }
tower-http = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
windows-sys = "0.61"

[workspace.lints.rust]
unsafe_code = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Release artifacts of the client: it runs on every monitored host, so trade speed for size.
[profile.release-small]
inherits = "release"
opt-level = "z"
panic = "abort"
